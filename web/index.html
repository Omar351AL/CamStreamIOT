<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cameras | CamStream</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/assets/logo.png" alt="Quantum"></a>
    <nav class="nav" aria-label="Main">
      <a href="/" class="active" aria-current="page">Cameras</a>
      <a href="#" data-soon="Recordings">Recordings</a>
      <a href="#" data-soon="Alerts">Alerts</a>
      <a href="#" data-soon="Settings">Settings</a>
    </nav>
    <div class="user">
      <button class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" data-initial>A</span><span class="user-name" data-user>admin</span>
      </button>
      <div class="menu" id="user-menu" role="menu" hidden>
        <button role="menuitem" data-soon="Account settings">Account settings</button>
        <hr>
        <button role="menuitem" id="sign-out">Sign out</button>
      </div>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>Cameras</h1>
      <p id="summary">Checking your cameras</p>
    </div>
    <div class="page-actions">
      <button class="btn" data-soon="Layouts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Layout
      </button>
      <button class="btn btn-primary" data-soon="Adding cameras">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add camera
      </button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div class="splash" id="splash" aria-hidden="true">
  <div class="loader">
    <div class="loader-mark"><img src="/assets/mark.png" alt=""></div>
    <div class="loader-text">Loading your cameras</div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<template id="cam-tpl">
  <a class="cam">
    <div class="cam-view">
      <div class="frame"><i></i><i></i><i></i><i></i></div>
      <span class="status"><span class="dot"></span><span class="status-text"></span></span>
      <span class="play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg></span>
    </div>
    <div class="cam-body">
      <div><h3 class="cam-name"></h3><p class="cam-loc"></p></div>
      <div class="cam-specs"></div>
    </div>
  </a>
</template>

<script src="/assets/app.js"></script>
<script>
  const started = performance.now();
  const grid = document.getElementById('grid');
  const tpl = document.getElementById('cam-tpl');

  function render(cams) {
    grid.textContent = '';
    for (const c of cams) {
      const card = tpl.content.firstElementChild.cloneNode(true);
      card.href = `/camera.html?id=${encodeURIComponent(c.id)}`;
      card.querySelector('.cam-view').classList.add(c.online ? 'is-live' : 'is-off');
      card.querySelector('.status-text').textContent = c.online ? 'Live' : 'Offline';
      card.querySelector('.cam-name').textContent = c.name;
      card.querySelector('.cam-loc').textContent = c.location;
      card.querySelector('.cam-specs').textContent = c.tracks.length ? c.tracks.join(', ') : '';
      card.setAttribute('aria-label', `${c.name}, ${c.online ? 'live' : 'offline'}. Open live view`);
      grid.appendChild(card);
    }
    const add = document.createElement('button');
    add.className = 'cam-add';
    add.dataset.soon = 'Adding cameras';
    add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add a camera';
    grid.appendChild(add);

    const online = cams.filter((c) => c.online).length;
    document.getElementById('summary').textContent =
      `${cams.length} ${cams.length === 1 ? 'camera' : 'cameras'}, ${online} online`;
  }

  async function refresh() {
    try { render((await api('/api/cameras')).cameras); }
    catch { document.getElementById('summary').textContent = 'Camera status is unavailable right now.'; }
  }

  (async () => {
    loadUser();
    await refresh();
    hideSplash(document.getElementById('splash'), started);
    setInterval(refresh, 15000);
  })();
</script>
</body>
</html>
