# CamStream first-run site: plain HTTP so Certbot can issue the certificate.
# After `certbot certonly --nginx -d camstream.omaralabed.com`, re-run install-server.sh.
server {
    listen 80;
    listen [::]:80;
    server_name camstream.omaralabed.com;
    root /var/www/camstream;
    location / { return 503; }
}
