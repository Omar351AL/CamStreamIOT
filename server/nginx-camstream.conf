# CamStream site. Certbot adds the 443 block once DNS for the host exists.
server {
    listen 80;
    listen [::]:80;
    server_name camstream.omaralabed.com;

    root /var/www/camstream;
    index index.html;

    auth_basic "CamStream";
    auth_basic_user_file /etc/nginx/camstream.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    # MediaMTX WebRTC player + WHEP signalling (bound to localhost only).
    location /cam/ {
        proxy_pass http://127.0.0.1:8889/;
        # WHEP session URLs come back as /camera1/whep/<id>; keep them under /cam/.
        proxy_redirect ~^/(.+)$ /cam/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
