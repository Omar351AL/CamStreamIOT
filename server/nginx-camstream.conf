# CamStream site (final, with TLS). install-server.sh uses nginx-camstream-bootstrap.conf
# until the Let's Encrypt certificate exists, then installs this file.
server {
    listen 80;
    listen [::]:80;
    server_name camstream.omaralabed.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name camstream.omaralabed.com;

    ssl_certificate /etc/letsencrypt/live/camstream.omaralabed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camstream.omaralabed.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/camstream;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Session check used by auth_request (cookie set by the login backend).
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8410/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Public: sign-in page, its assets, and the login/logout endpoints.
    location = /login.html { try_files $uri =404; }
    location /assets/ { try_files $uri =404; expires 1h; }
    location = /favicon.ico { alias /var/www/camstream/assets/favicon.png; }
    location /auth/ {
        proxy_pass http://127.0.0.1:8410;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    # Signed-in only.
    location /api/ {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:8410;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MediaMTX WebRTC (WHEP) signalling, bound to localhost only.
    location /cam/ {
        auth_request /_auth;
        proxy_pass http://127.0.0.1:8889/;
        # WHEP session URLs come back as /camera1/whep/<id>; keep them under /cam/.
        proxy_redirect ~^/(.+)$ /cam/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @signin;
        try_files $uri $uri/ =404;
    }
    location @signin { return 302 /login.html; }
}
